<nav>
  <a 
    href="#home" 
    class="nav-logo"
    (click)="$event.preventDefault(); scrollToSection('home')"
  >Brandon<span>.</span></a>

  <ul class="nav-links">
    @for (navLink of navLinks; track navLink.sectionId) {
      <li>
        <a
          [href]="'#' + navLink.sectionId"
          [class.is-active]="isLinkActive(navLink.sectionId)"
          (click)="$event.preventDefault(); scrollToSection(navLink.sectionId)"
        >
          {{ navLink.label }}
        </a>
      </li>
    }
  </ul>

  <a 
    href="#contact" 
    class="nav-cta"
    (click)="$event.preventDefault(); scrollToSection('contact')"
  >Hire me</a>
</nav>
